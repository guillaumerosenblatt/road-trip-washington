  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);

  transform: translate(2px, -50%);

}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;

      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)

    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);

  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

  }

  ) {

    max-width: 100%;

  }

  }

  .form-check-input {

  }

    left: 50%;

    height: 44px;

  }

  .form-check-label {

  }

  }

  }

}

svg {

  height: auto;
}

#widget &gt; svg {

}

}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;style&gt;
  #road-loops-map { width: 100%; }
  #road-loops-map h2 { margin-bottom: 12px; }
  #road-loops-map .viz-controls { margin-bottom: 10px; }
  #road-loops-map .route-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 8px 0 10px; color: var(--muted-foreground); }
  #road-loops-map .route-legend span { display: inline-flex; align-items: center; gap: 6px; }
  #road-loops-map .event-picker .form-label { min-width: min(100%, 440px); }
  #road-loops-map .route-swatch { width: 22px; height: 3px; display: inline-block; }
  #road-loops-map .route-one { background: var(--viz-series-1); }
  #road-loops-map .route-two { background: var(--viz-series-2); }
  #road-loops-map .route-three { background: var(--viz-series-3); }
  #road-loops-map .marker-shape { width: 10px; height: 10px; display: inline-block; }
  #road-loops-map .marker-shape.lodging { background: var(--purple); transform: rotate(45deg); }
  #road-loops-map .marker-shape.overnight { border-radius: 50%; background: var(--foreground); }
  #road-loops-map .marker-shape.event { background: var(--orange); clip-path: polygon(50% 0,61% 34%,98% 35%,68% 56%,79% 91%,50% 70%,21% 91%,32% 56%,2% 35%,39% 34%); }
  #road-loops-map .marker-shape.activity { border-radius: 50%; border: 2px solid var(--green); }
  #road-loops-map .map-stage { position: relative; width: 100%; }
  #road-loops-map #loops-svg { display: block; width: 100%; height: auto; min-height: 310px; }
  #road-loops-map .map-frame { fill: none; stroke: var(--border); stroke-width: 1; pointer-events: none; }
  #road-loops-map .state { fill: var(--muted); fill-opacity: .68; stroke: var(--border); stroke-width: 1; }
  #road-loops-map .state-label { fill: var(--muted-foreground); font-size: 13px; font-weight: 500; text-anchor: middle; pointer-events: none; }
  #road-loops-map .route-path { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
  #road-loops-map .route-path.is-muted { opacity: .64; stroke-width: 3; }
  #road-loops-map .route-path.appalachia { stroke: var(--viz-series-1); }
  #road-loops-map .route-path.mixed { stroke: var(--viz-series-2); }
  #road-loops-map .route-path.virginia { stroke: var(--viz-series-3); }
  #road-loops-map .route-halo { fill: none; stroke: var(--background); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; opacity: .76; }
  #road-loops-map .map-marker { cursor: pointer; stroke: var(--background); stroke-width: 2; }
  #road-loops-map .map-marker.lodging { fill: var(--purple); }
  #road-loops-map .map-marker.overnight { fill: var(--foreground); }
  #road-loops-map .map-marker.event,
  #road-loops-map .map-marker.recommendation { fill: var(--orange); }
  #road-loops-map .map-marker.activity { fill: var(--background); stroke: var(--green); stroke-width: 3; }
  #road-loops-map .map-marker.start { fill: var(--red); }
  #road-loops-map .map-label { fill: var(--foreground); font-size: 12px; font-weight: 500; paint-order: stroke; stroke: var(--background); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
  #road-loops-map #map-loading { position: absolute; inset: 45% auto auto 50%; transform: translate(-50%,-50%); }
  #road-loops-map #route-summary { margin-top: 10px; }
  #road-loops-map .summary-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
  #road-loops-map .summary-line strong { font-weight: 500; }
  #road-loops-map .place-detail { margin-top: 10px; }
  #road-loops-map .place-detail h3 { margin: 0 0 6px; }
  #road-loops-map .place-detail p { margin: 5px 0; }
  #road-loops-map .place-detail a { display: inline-block; margin-top: 4px; }
  #road-loops-map .section-title { margin-top: 16px; }
  #road-loops-map .day-list { margin-top: 10px; }
  #road-loops-map .day-row { display: grid; grid-template-columns: 88px minmax(0,1fr) auto; gap: 10px; align-items: start; padding: 9px 0; border-bottom: 1px solid var(--border); }
  #road-loops-map .day-row:last-child { border-bottom: 0; }
  #road-loops-map .day-date { font-weight: 500; }
  #road-loops-map .day-drive { color: var(--muted-foreground); white-space: nowrap; }
  #road-loops-map .compare-list { display: grid; gap: 8px; }
  #road-loops-map .compare-item { display: grid; grid-template-columns: 18px minmax(0,1fr) auto; gap: 8px; align-items: baseline; }
  #road-loops-map .compare-line { width: 16px; height: 3px; }
  #road-loops-map .recommendations { margin-top: 22px; }
  #road-loops-map .recommendations-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 12px; }
  #road-loops-map .recommendations-head h3 { margin-bottom: 3px; }
  #road-loops-map .day-tabs { margin-bottom: 12px; }
  #road-loops-map .event-filters { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 10px; align-items: end; margin-bottom: 12px; }
  #road-loops-map .event-filters .form-label { min-width: 0; }
  #road-loops-map .event-table-wrap { margin-top: 2px; }
  #road-loops-map .event-name { display: flex; align-items: flex-start; gap: 7px; font-weight: 500; }
  #road-loops-map .event-star { color: var(--yellow); flex: 0 0 auto; }
  #road-loops-map .zone-heading th {
    padding: 12px 10px;
    background: #000;
    color: #fff;
    font-weight: 500;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
  }
  #road-loops-map .zone-heading:not(:first-child) th { border-top: 14px solid var(--background); }
  #road-loops-map .lodging-zone-row td { padding: 8px 10px; background: #ff385c; color: #fff; }
  #road-loops-map .lodging-zone-row.hotel td { background: #003580; }
  #road-loops-map .lodging-zone-content { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  #road-loops-map .lodging-zone-main { display: flex; align-items: baseline; gap: 6px 12px; flex-wrap: wrap; }
  #road-loops-map .lodging-zone-provider,
  #road-loops-map .lodging-zone-name { font-weight: 500; }
  #road-loops-map .lodging-zone-row a { color: #fff; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  #road-loops-map .lodging-zone-row .lodging-status { opacity: .9; }
  #road-loops-map .fit-good { color: var(--green); }
  #road-loops-map .fit-choice { color: var(--orange); }
  #road-loops-map .fit-detour { color: var(--red); }
  #road-loops-map .details-button { white-space: nowrap; }
  @media (max-width: 620px) {
    #road-loops-map .day-row { grid-template-columns: 72px minmax(0,1fr); }
    #road-loops-map .day-drive { grid-column: 2; white-space: normal; }
    #road-loops-map .compare-item { grid-template-columns: 18px minmax(0,1fr); }
    #road-loops-map .compare-item .text-muted { grid-column: 2; }
    #road-loops-map .recommendations-head { flex-direction: column; }
    #road-loops-map .event-filters { grid-template-columns: 1fr; }
  }
&lt;/style&gt;
